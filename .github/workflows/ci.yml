name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Python ${{ matrix.python-version }} / Scrapy ${{ matrix.scrapy }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - python-version: "3.11"
            scrapy: "Scrapy==2.11.*"
          - python-version: "3.12"
            scrapy: "Scrapy>=2.13,<3"
          - python-version: "3.13"
            scrapy: "Scrapy>=2.13,<3"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install -e ".[test]"
      - run: python -m pip install "${{ matrix.scrapy }}"
      # Scrapy 2.11 imports a private Twisted helper removed in Twisted 26.
      # Keep the legacy compatibility job honest without constraining newer
      # Scrapy versions, which support current Twisted releases.
      - if: matrix.python-version == '3.11'
        run: python -m pip install "Twisted<26"
      - run: pytest
      - run: ruff check .

  package:
    name: Build package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[test]"
      - run: python -m build
      - run: twine check dist/*
